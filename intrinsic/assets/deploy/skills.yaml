# yamllint disable-file
# This file is not valid yaml because it is a template

{{- range .Values.pods }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}

spec:
  selector:
    matchLabels:
      app: {{ .name }}
  # Don't start a new pod until the existing one has stopped.
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: {{ .name }}
        intrinsic.ai/platform-layer: skill
        {{- range .containers }}
        skill/{{ .asset }}: "true"
        {{- end }}
    # The spec for the Skill pod
    spec:
      automountServiceAccountToken: false
      containers:
        {{- range .containers }}
        - name: {{ .name }}
          image: {{ .registry }}/{{ .image_ref }}
          args:
            - /skills/skill_service
            - --logtostderr
            - --port={{ .port }}
            - --data_logger_grpc_service_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            - --world_service_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            - --geometry_service_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            - --motion_planner_service_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            # TODO(305062153) Remove the registry address once we don't need to support old C++ Skills.
            - --skill_registry_service_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            - --skill_service_config_filename=/skills/skill_service_config.proto.bin
            - --grpc_connect_timeout_secs=300
            - --default_ls_watcher=null
            - --undefok=default_ls_watcher
            - --opencensus_metrics_port={{ .metrics_port }}
            - --opencensus_tracing
          env:
            # Avoid C-ARES flakiness: b/373783242
            - name: GRPC_DNS_RESOLVER
              value: native
            # Set to "poll" as the default showed sporadic failures every few
            # thousand calls. With "poll" process executions run for >1,000,000
            # skill executions.
            # TODO(b/576245575): Reconsider using the default poll strategy once
            # its instability is understood and fixed.
            - name: GRPC_POLL_STRATEGY
              value: poll
        {{- end }}
      {{- if .image_pull_secrets }}
      imagePullSecrets:
        {{- range .image_pull_secrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .name }}
  policyTypes:
    - Egress
  egress:
    # Skills need to be able to reach out to resources and a few other
    # platform services. The simplest way to do this right now, while
    # restricting generic outbound connections, is to allow Skills to reach out
    # to any service that we present via the ingress gateway for the cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-ingress
          podSelector:
            matchLabels:
              app: istio-ingressgateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-intrinsic-base
          podSelector:
            matchLabels:
              app: zenoh-router
      ports:
        - protocol: TCP
          port: 7447
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow skills to send trace data to OpenCensus and OpenTelemetry.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-intrinsic-base
          podSelector:
            matchLabels:
              app: opencensus
      ports:
        - protocol: TCP
          port: 55678
        - protocol: TCP
          port: 4317
{{- end }}  # range .Values.pods

{{- range .Values.skills }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sc-{{ .name }}
  labels:
    app: skill-registry-config
    solution.intrinsic.ai/asset: {{ .asset }}
data:
  id_version: {{ .skill_id_version }}
  # LINT.IfChange(installation_origin_key)
  installation_origin: {{ .installation_origin }}
  # LINT.ThenChange(//intrinsic/assets/deploy/renderutil.go:skill_installation_origin_key)
  validate_handle: dns:///{{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ .port }}
  project_handle: dns:///{{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ .port }}
  execute_handle: dns:///{{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ .port }}
  skill_info_handle: dns:///{{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ .port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    solution.intrinsic.ai/asset: {{ .asset }}
spec:
  clusterIP: None
  ports:
    - port: {{ .port }}
      name: grpc-{{ .name }}
  selector:
    app: {{ .pod_name }}
  type: ClusterIP

{{ $asset := .asset }}
{{ $name := .name }}
{{- with .private_registry_key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    solution.intrinsic.ai/asset: {{ $asset }}
data:
  .dockercfg: {{ . }}
type: kubernetes.io/dockercfg
{{- end }}
{{- end }}  # range .Values.skills
